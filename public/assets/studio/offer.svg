<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 660" width="520" height="660" role="img" aria-label="Perks offer: what a creator gets for joining Your Org"><rect x="0.5" y="0.5" width="519" height="659" rx="24" fill="#FBF9F3" stroke="#DCD4C3" stroke-width="1"/><rect x="28" y="28" width="52" height="52" rx="14" fill="#0D2257"/><text x="54" y="60.84" font-family="Saira, 'DM Sans', sans-serif" font-size="19" font-weight="700" fill="#FFFFFF" text-anchor="middle">YO</text><text x="94" y="50" font-family="Saira, 'DM Sans', sans-serif" font-size="22" font-weight="700" fill="#0A0C11" text-anchor="start">Your Org</text><text x="94" y="72" font-family="'DM Sans', Arial, sans-serif" font-size="14" font-weight="400" fill="#3E4350" text-anchor="start">Creator program</text><rect x="370" y="38" width="122" height="26" rx="13" fill="#DFE7FA"/><text x="431" y="55.5" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="11.5" font-weight="700" fill="#2457F5" text-anchor="middle">Creator offer</text><path d="M28 104H492" stroke="#DCD4C3" stroke-width="1" fill="none"/><text x="28" y="150" font-family="Saira, 'DM Sans', sans-serif" font-size="38" font-weight="700" fill="#0A0C11" text-anchor="start">For Pixelle</text><text x="28" y="180" font-family="'DM Sans', Arial, sans-serif" font-size="16" font-weight="400" fill="#3E4350" text-anchor="start">Join Your Org and you get:</text><circle cx="42" cy="224" r="14" fill="#2457F5"/><path d="M36.12 224.5l4.2 4.2 7.840000000000001 -8.68" fill="none" stroke="#fff" stroke-width="2.8000000000000003" stroke-linecap="round" stroke-linejoin="round"/><text x="70" y="223" font-family="'DM Sans', Arial, sans-serif" font-size="17" font-weight="600" fill="#0A0C11" text-anchor="start">Clips from every stream</text><text x="70" y="245" font-family="'DM Sans', Arial, sans-serif" font-size="14" font-weight="400" fill="#3E4350" text-anchor="start">Cut, subtitled and posted on your rhythm</text><circle cx="42" cy="290" r="14" fill="#2457F5"/><path d="M36.12 290.5l4.2 4.2 7.840000000000001 -8.68" fill="none" stroke="#fff" stroke-width="2.8000000000000003" stroke-linecap="round" stroke-linejoin="round"/><text x="70" y="289" font-family="'DM Sans', Arial, sans-serif" font-size="17" font-weight="600" fill="#0A0C11" text-anchor="start">A schedule page</text><text x="70" y="311" font-family="'DM Sans', Arial, sans-serif" font-size="14" font-weight="400" fill="#3E4350" text-anchor="start">Kept in sync, with go-live alerts</text><circle cx="42" cy="356" r="14" fill="#2457F5"/><path d="M36.12 356.5l4.2 4.2 7.840000000000001 -8.68" fill="none" stroke="#fff" stroke-width="2.8000000000000003" stroke-linecap="round" stroke-linejoin="round"/><text x="70" y="355" font-family="'DM Sans', Arial, sans-serif" font-size="17" font-weight="600" fill="#0A0C11" text-anchor="start">A media kit that updates itself</text><text x="70" y="377" font-family="'DM Sans', Arial, sans-serif" font-size="14" font-weight="400" fill="#3E4350" text-anchor="start">Live numbers, ready for any brand</text><circle cx="42" cy="422" r="14" fill="#2457F5"/><path d="M36.12 422.5l4.2 4.2 7.840000000000001 -8.68" fill="none" stroke="#fff" stroke-width="2.8000000000000003" stroke-linecap="round" stroke-linejoin="round"/><text x="70" y="421" font-family="'DM Sans', Arial, sans-serif" font-size="17" font-weight="600" fill="#0A0C11" text-anchor="start">Brand deals brought to you</text><text x="70" y="443" font-family="'DM Sans', Arial, sans-serif" font-size="14" font-weight="400" fill="#3E4350" text-anchor="start">Tracked from the brief to the payout</text><circle cx="42" cy="488" r="14" fill="#2457F5"/><path d="M36.12 488.5l4.2 4.2 7.840000000000001 -8.68" fill="none" stroke="#fff" stroke-width="2.8000000000000003" stroke-linecap="round" stroke-linejoin="round"/><text x="70" y="487" font-family="'DM Sans', Arial, sans-serif" font-size="17" font-weight="600" fill="#0A0C11" text-anchor="start">A report every month</text><text x="70" y="509" font-family="'DM Sans', Arial, sans-serif" font-size="14" font-weight="400" fill="#3E4350" text-anchor="start">What grew, and what to try next</text><path d="M28 566H492" stroke="#DCD4C3" stroke-width="1" fill="none"/><text x="28" y="600" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="12" font-weight="600" fill="#7B808C" text-anchor="start">Starts</text><text x="28" y="628" font-family="Saira, 'DM Sans', sans-serif" font-size="21" font-weight="700" fill="#0A0C11" text-anchor="start">The day you sign</text><text x="492" y="600" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="12" font-weight="600" fill="#7B808C" text-anchor="end">Signed</text><path d="M330 626c10-16 18-20 22-10s-4 18 4 12 12-22 20-14-2 16 8 10 14-14 22-8 6 10 16 4 18-6 30-4" fill="none" stroke="#2457F5" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
